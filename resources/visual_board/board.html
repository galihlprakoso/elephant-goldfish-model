<title>EGM Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header with stage rail; story strip; picture sections with the user's calls pinned inside; one sticky tray at the bottom with the single button that moves on. */
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f4; --fg: #1c2230; --muted: #5d6678; --line: #d9dde5;
  --accent: #e0662a; --accent-soft: #fbe6da;          /* goldfish: needs you */
  --elephant: #56627a; --elephant-soft: #e3e7ef;      /* elephant: neutral structure */
  --blocker: #c4362f; --blocker-soft: #f8dedc; --major: #b7790c; --major-soft: #f7ecd2;
  --nit: #2f7d6b; --nit-soft: #d9efe8; --good: #2f7d4a; --good-soft: #dcefe1; --info: #3462b8; --info-soft: #dfe8f8;
  --focus: #3462b8;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1a1f29; --surface-2: #222835; --fg: #e6e9ef; --muted: #9aa3b5; --line: #2f3646;
    --accent: #f08550; --accent-soft: #3a2519; --elephant: #9aa6bf; --elephant-soft: #262d3b;
    --blocker: #f07067; --blocker-soft: #3b1f1e; --major: #e2ad48; --major-soft: #372c16; --nit: #5cc2a7; --nit-soft: #17322b;
    --good: #67c48a; --good-soft: #183223; --info: #7ea4ec; --info-soft: #1b2740; --focus: #7ea4ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1f29; --surface-2: #222835; --fg: #e6e9ef; --muted: #9aa3b5; --line: #2f3646;
  --accent: #f08550; --accent-soft: #3a2519; --elephant: #9aa6bf; --elephant-soft: #262d3b;
  --blocker: #f07067; --blocker-soft: #3b1f1e; --major: #e2ad48; --major-soft: #372c16; --nit: #5cc2a7; --nit-soft: #17322b;
  --good: #67c48a; --good-soft: #183223; --info: #7ea4ec; --info-soft: #1b2740; --focus: #7ea4ec;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 14px; height: 14px; }
.icon.lg { width: 24px; height: 24px; }

/* Header + stage rail */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
.titlerow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.titlerow h1 { font-size: 20px; letter-spacing: -0.01em; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.mono { font-family: var(--font-mono); font-size: 11.5px; }
.turn { margin-left: auto; font-weight: 600; }
.turn[data-who="you"] { background: var(--accent-soft); color: var(--accent); }
.turn[data-who="claude"], .turn[data-who="reviewers"] { background: var(--info-soft); color: var(--info); }
.turn[data-who="done"] { background: var(--good-soft); color: var(--good); }
.rail { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 2px; }
.stage { flex: 1 0 auto; min-width: 84px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
.stage .bar { height: 6px; border-radius: 3px; background: var(--surface-2); }
.stage[data-state="done"] .bar { background: var(--elephant); }
.stage[data-state="active"] .bar { background: var(--accent); }
.stage[data-state="waiting"] .bar { background: repeating-linear-gradient(90deg, var(--accent) 0 6px, var(--accent-soft) 6px 12px); }
.stage[data-state="active"], .stage[data-state="waiting"] { color: var(--fg); font-weight: 600; }
.stage[data-state="skipped"] .bar { background: transparent; border: 1px dashed var(--line); }

main.wrap { padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
.headline { display: flex; align-items: flex-start; gap: 10px; font-family: var(--font-display); font-size: 18px; font-weight: 600; }
.headline .icon { width: 22px; height: 22px; color: var(--accent); margin-top: 2px; }

/* Story strip */
.story { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.frame { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; color: inherit; text-decoration: none; border-left: 1px solid var(--line); margin-left: -1px; }
.frame .k { display: flex; align-items: center; gap: 6px; font: 600 11px var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.frame .v { font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.frame[data-tone="problem"] { background: var(--blocker-soft); } .frame[data-tone="problem"] .k { color: var(--blocker); }
.frame[data-tone="done"] { background: var(--good-soft); } .frame[data-tone="done"] .k { color: var(--good); }
.frame[data-tone="you"] { background: var(--accent-soft); } .frame[data-tone="you"] .k { color: var(--accent); }
a.frame:hover .v { text-decoration: underline; text-underline-offset: 3px; }

/* Sections */
.sections { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; scroll-margin-top: 120px; }
.sec.wide { grid-column: 1 / -1; }
.sec > header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec > header h3 { font-size: 15.5px; }
.sec > header .icon { color: var(--elephant); }
.sec.noted { border-color: var(--accent); }
.suggest { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 12.5px; display: inline-flex; gap: 5px; align-items: center; padding: 4px 6px; border-radius: 6px; }
.suggest:hover { color: var(--accent); background: var(--accent-soft); }
.sec.noted .suggest { color: var(--accent); font-weight: 600; }
.secstate + .suggest { margin-left: 0; }
.secstate { margin-left: auto; }
textarea { width: 100%; font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }

/* Canvas: Claude draws inside. The page wires [data-show]/[data-panel] and styles a few helpers. */
.canvas { min-width: 0; overflow-x: auto; color: var(--fg); }
.canvas svg:not(.icon) { display: block; max-width: 100%; height: auto; margin-inline: auto; font-family: var(--font-body); }
.canvas svg text { fill: currentColor; }
.canvas img { max-width: 100%; }
.canvas [data-show] { cursor: pointer; }
.canvas details > summary { cursor: pointer; color: var(--info); font-size: 12.5px; list-style: none; display: inline-flex; gap: 4px; align-items: center; }
.canvas details > summary::-webkit-details-marker { display: none; }
.canvas details > summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 15px; line-height: 1; }
.canvas details[open] > summary::before { transform: rotate(90deg); }
.term { border-bottom: 1px dotted var(--muted); cursor: help; }
.qs { display: flex; flex-direction: column; gap: 10px; }
.q label, .q .ql { display: block; font-weight: 600; margin-bottom: 4px; }
.q .choices + .qother { margin-top: 8px; }
.qother { width: 100%; box-sizing: border-box; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.q small { color: var(--muted); display: block; margin-bottom: 4px; }

/* Calls: the only decision buttons on the page */
.calls { display: flex; flex-direction: column; gap: 10px; }
.callswrap { display: flex; flex-direction: column; gap: 10px; }
.callswrap > h2 { font-size: 16px; display: flex; gap: 8px; align-items: center; }
.callswrap > h2 .icon { color: var(--accent); }
.call { border: 2px solid var(--accent); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 120px; }
.call.answered { border-color: var(--line); }
.call .cq { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.call .cq b { font-family: var(--font-display); font-size: 14.5px; }
.tagc { font: 700 10.5px var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: #fff; background: var(--accent); border-radius: 999px; padding: 2px 8px; }
.call.answered .tagc { background: var(--good); }
.sev { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.sev.blocker { background: var(--blocker-soft); color: var(--blocker); }
.sev.major { background: var(--major-soft); color: var(--major); }
.sev.nit { background: var(--nit-soft); color: var(--nit); }
.lens { margin-left: auto; }
.fixline { display: flex; gap: 8px; font-size: 13.5px; align-items: flex-start; }
.fixline .icon { color: var(--info); margin-top: 2px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px 6px 8px; display: inline-flex; gap: 7px; align-items: center; font-size: 13px; }
.choice::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); flex: none; box-sizing: border-box; }
.choice[aria-checked="true"] { border-color: var(--fg); background: var(--surface); font-weight: 600; }
.choice[aria-checked="true"]::before { border-color: var(--fg); background: radial-gradient(var(--fg) 0 2.5px, transparent 3px); }

/* Tray */
.tray { position: sticky; bottom: 0; z-index: 4; background: var(--surface); border-top: 2px solid var(--accent); }
.tray .wrap { padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.tstat { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 13px; min-width: 0; }
.tstat a, .tstat span, .tstat button { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); text-decoration: none; background: none; border: 0; padding: 0; font-size: 13px; }
.tstat .todo { color: var(--accent); font-weight: 600; }
.tstat .ok { color: var(--good); }
.tstat button.link { color: var(--info); text-decoration: underline; text-underline-offset: 3px; }
.tacts { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.more { position: relative; }
.ghost { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 13px; display: inline-flex; gap: 5px; align-items: center; }
.menu { position: absolute; bottom: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; min-width: 220px; box-shadow: 0 6px 20px rgb(0 0 0 / .14); }
.menu button { border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: 6px; font-size: 13px; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--surface-2); }
.primary { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; }
.primary[aria-disabled="true"] { background: var(--surface-2); color: var(--muted); }
.primary[disabled] { opacity: .6; cursor: progress; }
.tmsg { flex-basis: 100%; font-size: 12.5px; color: var(--muted); }
.tmsg[data-tone="bad"] { color: var(--blocker); } .tmsg[data-tone="good"] { color: var(--good); }
.tmsg:empty { display: none; }
#b-copy { font-family: var(--font-mono); font-size: 12px; }

/* Glossary + history */
.twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; min-width: 0; }
.panel > summary { cursor: pointer; font: 600 14px var(--font-display); display: flex; gap: 8px; align-items: center; list-style: none; }
.panel > summary::-webkit-details-marker { display: none; }
.panel[open] > summary { margin-bottom: 10px; }
dl.gloss { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 13px; }
dl.gloss dt { font-weight: 600; } dl.gloss dd { margin: 0; color: var(--muted); }
ol.hist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
ol.hist li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; }
ol.hist time { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }
@media (max-width: 560px) {
  .turn { margin-left: 0; }
  ol.hist li { grid-template-columns: 1fr; gap: 2px; }
  .tacts { margin-left: 0; width: 100%; }
  .tacts .primary { flex: 1; justify-content: center; }
}
@media (prefers-reduced-motion: no-preference) {
  .call, .choice, .sec { transition: border-color .15s, background-color .15s; }
}
</style>

<script>
(function () {
  "use strict";
  var DATA;

  var S = DATA.session || {};
  var ROUND = S.round || 1;
  var YOU = DATA.turn === "you";
  var LENS_ICON = {
    "egm-design": "compass", "egm-zoom-out": "zoom", "egm-comprehension": "eye", "egm-codebase-details": "code",

    var use = document.createElementNS("http://www.w3.org/2000/svg", "use");
    use.setAttribute("href", "#i-" + (name || "layers"));
    svg.appendChild(use);
    return svg;
  }
  function $(id) { return document.getElementById(id); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }

  // ---------- Local memory (per browser; used when no board database) ----------
  var LKEY = "egm-board:" + (S.title || "") + ":" + ROUND;
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- Header ----------

  (DATA.stages || []).forEach(function (st) {
    $("b-rail").appendChild(el("div", { class: "stage", "data-state": st.state || "todo", role: "listitem", title: st.label + ": " + (st.state || "todo") }, [
      el("div", { class: "bar" }), el("span", { text: st.label })
    ]));
  });
  if (DATA.headline) { $("b-headline").hidden = false; $("b-headline").querySelector("span").textContent = DATA.headline; }

  // ---------- Story strip ----------
  if ((DATA.story || []).length) {
    $("b-story").hidden = false;
    DATA.story.forEach(function (f) {
      var kids = [el("span", { class: "k" }, [icon(f.icon || "target", "sm"), f.label || ""]), el("span", { class: "v", text: f.text || "" })];
      $("b-story").appendChild(f.to ? el("a", { class: "frame", href: "#sec-" + f.to, "data-tone": f.tone || null }, kids)
                                    : el("div", { class: "frame", "data-tone": f.tone || null }, kids));
    });
  }

  // ---------- Canvas: agent-drawn SVG/HTML, with show/panel wiring ----------
  function wire(box) {
    var shows = Array.prototype.slice.call(box.querySelectorAll("[data-show]"));
    if (!shows.length) return;
    function groupOf(n) { return n.closest("[data-group]") || box; }

    }
    var groups = [];
    shows.forEach(function (b) {
      if (b.tagName !== "BUTTON") {
        b.setAttribute("tabindex", "0"); b.setAttribute("role", "button");
        b.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(b); } });
      }
      b.addEventListener("click", function () { activate(b); });
      var g = groupOf(b); if (groups.indexOf(g) < 0) groups.push(g);

      if (!opts.length) {

        return el("div", { class: "q" }, [el("label", { for: id, text: q.q }), hint, ta]);

      var group = el("div", { class: "choices", role: "radiogroup", "aria-labelledby": id + "-l" });
      var other = el("input", { type: "text", class: "qother", id: id, maxlength: "400", placeholder: "Your answer", "aria-label": "Other answer", hidden: "" });
      function pick(v) { group.querySelectorAll(".choice").forEach(function (x) { x.setAttribute("aria-checked", String(x.dataset.v === v)); }); }
      opts.concat([{ id: "__other", label: "Other…" }]).forEach(function (o) {
        var b = el("button", { class: "choice", type: "button", role: "radio", "aria-checked": "false", "data-v": o.id, text: o.label });
        b.addEventListener("click", function () {
          pick(o.id);

        });
        group.appendChild(b);
      });
      other.addEventListener("change", function () { save(other.value.trim()); });
      qInputs[q.id] = function (a) {
        var m = opts.filter(function (o) { return o.label === a; })[0];
        if (m) { pick(m.id); other.hidden = true; }
        else if (a) { pick("__other"); other.hidden = false; other.value = a; }
      };
      return el("div", { class: "q" }, [el("div", { class: "ql", id: id + "-l", text: q.q }), hint, group, other]);
    }));
  }

  // ---------- Sections ----------
  var SEC_STATE = { draft: "Draft", approved: "Approved", changed: "Changed", new: "New" };
  var secSlots = {};
  sections.forEach(function (sec) {
    var head = el("header", null, [icon(sec.icon || "layers"), el("h3", { text: sec.title })]);

  findings.slice().sort(function (a, b) { return (a.severity in order ? order[a.severity] : 3) - (b.severity in order ? order[b.severity] : 3); }).forEach(function (f) {
    var opts = callOptions(f);
    var note = el("textarea", { id: "n-" + f.id, rows: "2", maxlength: "1500", placeholder: f.suggestion === "ESCALATE" ? "Your answer" : "What should we talk about?", hidden: "" });
    var group = el("div", { class: "choices", role: "radiogroup", "aria-label": f.title });
    opts.forEach(function (o) {
      var b = el("button", { class: "choice", type: "button", role: "radio", "aria-checked": "false", "data-v": o[0], text: o[1] });
      b.addEventListener("click", function () {
        var needNote = o[0] === "discuss" || (f.suggestion === "ESCALATE" && o[0] === "accept");
        note.hidden = !needNote; if (needNote) note.focus();
        setItem(f.id, { kind: "finding", title: f.title, verdict: o[0], note: note.value.trim() });
      });
      group.appendChild(b);
    });
    note.addEventListener("change", function () { var cur = state.items[f.id] || { kind: "finding", title: f.title }; setItem(f.id, Object.assign({}, cur, { note: note.value.trim() })); });
    var card = el("article", { class: "call", id: "f-" + f.id, "data-comment-target": "" }, [
      el("div", { class: "cq" }, [
        el("span", { class: "tagc", text: "Your call" }),
        el("b", { text: f.title }),
        f.severity ? el("span", { class: "sev " + f.severity, text: SEV_LABEL[f.severity] || f.severity }) : null,
        f.lens ? el("span", { class: "chip lens", title: f.lens }, [icon(LENS_ICON[f.lens] || "eye", "sm"), f.lens.replace(/^egm-/, "")]) : null
      ]),
      f.visual ? canvas(f.visual) : null,
      f.fix ? el("div", { class: "fixline" }, [icon(f.suggestion === "ESCALATE" ? "question" : "wrench", "sm"), el("span", { text: f.fix })]) : null,
      group, note
    ]);
    var slot = secSlots[f.where];
    if (slot) slot.appendChild(card); else { $("b-calls-wrap").hidden = false; $("b-calls").appendChild(card); }
    registry[f.id] = { kind: "finding", group: group, note: note, card: card, f: f };
  });

  // ---------- Glossary + history ----------
  if ((DATA.glossary || []).length) {
    $("b-gloss-wrap").hidden = false;
    $("b-gloss-h").textContent = "Plain words (" + DATA.glossary.length + ")";
    DATA.glossary.forEach(function (g) { $("b-gloss").appendChild(el("dt", { text: g.term })); $("b-gloss").appendChild(el("dd", { text: g.plain })); });
  }
  if ((DATA.history || []).length) {
    $("b-hist-wrap").hidden = false;
    DATA.history.slice().reverse().forEach(function (h) { $("b-hist").appendChild(el("li", null, [el("time", { text: h.at }), el("span", { text: h.event })])); });
  }

  // ---------- Decision state ----------
  function paintItem(id) {
    var v = state.items[id];
    if (v && v.kind === "question" && qInputs[id]) { qInputs[id](v.answer); return; }
    var r = registry[id]; if (!r || !v) return;
    if (r.kind === "finding") {
      r.group.querySelectorAll(".choice").forEach(function (x) { x.setAttribute("aria-checked", String(x.dataset.v === v.verdict)); });
      r.card.classList.toggle("answered", !!v.verdict);
    }
    if (v.note) { r.note.value = v.note; r.note.hidden = false; }
    if (r.kind === "section") r.box.classList.toggle("noted", v.verdict === "revise");
  }
  function openCalls() { return findings.filter(function (f) { return !(state.items[f.id] && state.items[f.id].verdict); }); }
  function notedSections() { return Object.keys(registry).filter(function (k) { return registry[k].kind === "section" && registry[k].note.value.trim(); }); }
  function gateOption() { return gate ? (gate.options || []).filter(function (o) { return o.id === state.gate; })[0] || (gate.options || [])[0] : null; }

  function paintTray() {
    $("b-tray").hidden = !YOU;
    if (!YOU) return;
    var st = $("b-tstat"); st.textContent = "";
    var send = $("b-send"), others = gate ? (gate.options || []) : [];
    // Already sent and nothing changed since: show that, not a button to press again.
    var sent = state.sent && state.sent.key === sentKey() ? state.sent : null;
    if (sent && sent.text === summary()) {
      send.hidden = true; $("b-more").hidden = true;
      st.appendChild(el("span", { class: "ok" }, [icon("check", "sm"), sent.how === "sent" ? "Sent to Claude" : "Reply copied"]));
      if (sent.how !== "sent") {
        var again = el("button", { class: "link", type: "button", text: "Copy again" });
        again.addEventListener("click", function () { copyReply(sent.text); });
        st.appendChild(again);
      }
      st.appendChild(el("span", null, [icon("pen", "sm"), "Change anything to send an update"]));
      return;
    }
    send.hidden = false;
    if (sent) msg("You changed something since sending. Send again to update.", null);
    var open = openCalls(), noted = notedSections();
    if (findings.length) {
      if (open.length) {
        var jump = el("a", { class: "todo", href: "#f-" + open[0].id }, [icon("pin", "sm"), plural(open.length, "call") + " wait" + (open.length === 1 ? "s" : "") + " for you"]);
        st.appendChild(jump);
        var rest = el("button", { class: "link", type: "button", text: "Use the agent's pick for these" });
        rest.addEventListener("click", function () { open.forEach(function (f) { setItem(f.id, { kind: "finding", title: f.title, verdict: defaultVerdict(f), note: "", byDefault: true }); }); });
        st.appendChild(rest);
      } else st.appendChild(el("span", { class: "ok" }, [icon("check", "sm"), "All " + plural(findings.length, "call") + " made"]));
    }
    st.appendChild(noted.length ? el("span", null, [icon("pen", "sm"), plural(noted.length, "change") + " noted"])
                                : el("span", null, [icon("eye", "sm"), "No note = keep as is"]));
    var opt = gateOption(), l = $("b-sendl");
    if (open.length) { send.setAttribute("aria-disabled", "true"); l.textContent = "Make " + (open.length === 1 ? "the call" : "the calls") + " first"; }
    else {
      send.removeAttribute("aria-disabled");
      l.textContent = (opt ? opt.label : "Send to the agent") + (noted.length ? " · " + plural(noted.length, "change") : "");
    }
    $("b-more").hidden = others.length < 2;
  }
  function sentKey() { return ROUND + ":" + (gate ? gate.id : ""); }
  function markSent(text, how) { state.sent = { key: sentKey(), text: text, how: how }; saveLocal(); paintTray(); }
  if (gate) {
    state.gate = (gate.options || [])[0] ? gate.options[0].id : null;
    (gate.options || []).forEach(function (o) {
      var b = el("button", { type: "button", role: "menuitemradio", "aria-checked": "false", "data-id": o.id, text: o.label });
      b.addEventListener("click", function () { state.gate = o.id; paintMenu(); $("b-menu").hidden = true; $("b-morebtn").setAttribute("aria-expanded", "false"); saveGate(); paintTray(); });
      $("b-menu").appendChild(b);
    });
    $("b-morebtn").addEventListener("click", function () { var m = $("b-menu"); m.hidden = !m.hidden; $("b-morebtn").setAttribute("aria-expanded", String(!m.hidden)); });
    document.addEventListener("click", function (e) { if (!$("b-more").contains(e.target)) { $("b-menu").hidden = true; $("b-morebtn").setAttribute("aria-expanded", "false"); } });
  }
  function paintMenu() { $("b-menu").querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-checked", String(x.dataset.id === state.gate)); }); }

  var writeQueue = {};
  function persist(docId, value) {
    saveLocal();
    if (!db || !canWrite) return;
    if (writeQueue[docId]) { writeQueue[docId].next = value; return; }
    writeQueue[docId] = { next: null };
    db.doc("responses/" + docId).set(value).catch(function () { msg("Saved in this browser only. The reply still carries your choices.", "bad"); })
      .finally(function () { var q = writeQueue[docId]; delete writeQueue[docId]; if (q && q.next) persist(docId, q.next); });
  }
  function stamp(v) { v.round = ROUND; v.at = new Date().toISOString(); if (me) v.by = me; return v; }
  function setItem(id, v) { state.items[id] = v; paintItem(id); paintTray(); persist(id, stamp(Object.assign({}, v))); }
  function saveGate() { if (gate) persist(gate.id, stamp({ kind: "gate", question: gate.question, choice: state.gate })); }
  function msg(t, tone) { var s = $("b-msg"); s.textContent = t; if (tone) s.dataset.tone = tone; else delete s.dataset.tone; }

  // ---------- Reply ----------
  function summary() {
    var lines = ["EGM board reply (" + (S.skill || "egm") + ", round " + ROUND + (S.title ? ", " + S.title : "") + ")."];
    var opt = gateOption();
    if (gate) lines.push("Gate " + gate.id + ": " + (opt ? opt.label + " [" + opt.id + "]" : "no choice"));
    findings.forEach(function (f) {
      var v = state.items[f.id]; if (!v || !v.verdict) return;
      lines.push(f.id + ": " + v.verdict + (v.byDefault ? " (agent's pick)" : "") + (v.note ? " (" + v.note + ")" : ""));
    });
    var kept = [];
    Object.keys(registry).forEach(function (k) {
      var r = registry[k]; if (r.kind !== "section") return;
      var n = r.note.value.trim();
      if (n) lines.push(k + " (" + r.title + "): revise (" + n + ")"); else kept.push(r.title);
    });
    if (kept.length) lines.push("Keep as is: " + kept.join("; "));
    Object.keys(state.items).forEach(function (k) { var v = state.items[k]; if (v.kind === "question" && v.answer) lines.push(k + " answer: " + v.answer); });
    var text = lines.join("\n");
    while (new Blob([text]).size > 3900) text = text.slice(0, -200);
    return text;
  }
  async function copyReply(text, lead) {
    var ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    var box = $("b-copy"); box.value = text; box.hidden = ok;
    if (!ok) { box.focus(); box.select(); }
    msg((lead ? lead + " " : "") + (ok ? "Reply copied. Paste it into your agent's chat." : "Copy the reply below and paste it into your agent's chat."), ok ? "good" : null);
  }
  $("b-send").addEventListener("click", async function () {
    var open = openCalls();
    if (open.length) { var c = $("f-" + open[0].id); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    if (S.example) { msg("This is the example board. A real EGM session sends this reply.", null); return; }
    Object.keys(registry).forEach(function (k) { if (registry[k].kind === "section") { var n = registry[k].note.value.trim(); if (!state.items[k] || (state.items[k].note || "") !== n) setItem(k, n ? { kind: "section", section: registry[k].title, verdict: "revise", note: n } : { kind: "section", section: registry[k].title, verdict: "approve" }); } });
    saveGate();
    var text = summary();
    var comments = null, can = "off";
    if (window.claude && claude.use) {
      try { comments = await claude.use("comments"); } catch (e) { comments = null; }
      if (comments && comments.canSendToClaude) { try { can = await comments.canSendToClaude(); } catch (e) { can = "off"; } }
    }
    if (can !== "available") {
      var why = { writers_only: "Only editors can send to Claude.", no_session: "No Claude session is watching this board." }[can] || "";
      await copyReply(text, why);
      markSent(text, "copied");
      return;
    }
    var send = $("b-send"); send.disabled = true; msg("Sending…");
    try {
      var anchor = await comments.anchorFor($("b-tray"));
      await comments.sendToClaude({ anchor: anchor, text: text });
      msg("Claude will reply in the comment thread and update this board.", "good");
      markSent(text, "sent");
    } catch (e) {
      await copyReply(text, "Not sent (" + ((e && e.code) || "error") + ").");
      markSent(text, "copied");
    } finally { send.disabled = false; }
  });

  // ---------- Start ----------
  loadLocal();
  Object.keys(state.items).forEach(paintItem);
  if (gate && !(gate.options || []).some(function (o) { return o.id === state.gate; })) state.gate = (gate.options || [])[0] ? gate.options[0].id : null;
  if (gate) paintMenu();
  paintTray();

  // Board database (claude.ai only). The page works without it.
  (async function () {
    if (!window.claude || !claude.use || S.example) return;
    try {
      var user = await claude.use("user");
      if (user) {
        try { me = await user.id(); } catch (e) { me = null; }
        try { if (user.can && user.can("data.write") === false) canWrite = false; } catch (e) {}
      }
      db = await claude.use("db");
      if (!db) return;
      var timer = setTimeout(function () { msg("Saved choices are slow to load. You can still decide and send.", null); }, 10000);
      var snap = await db.collection("responses").where("round", "==", ROUND).get();
      clearTimeout(timer);
      (snap.docs || []).forEach(function (d) {
        var v = d.data ? d.data() : d.data, id = d.id;
        if (!v) return;
        if (v.kind === "gate" && gate && id === gate.id) { if (v.choice) state.gate = v.choice; paintMenu(); }
        else if (v.kind === "question") { state.items[id] = v; paintItem(id); }
        else if (registry[id]) { state.items[id] = v; paintItem(id); }
      });
      paintTray();
    } catch (e) { db = null; }
  })();
})();
</script>
